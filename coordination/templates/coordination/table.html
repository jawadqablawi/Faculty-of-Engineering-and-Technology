<div class="table-wrap"><table><thead><tr><th>الطلب / النشاط</th><th>النادي</th><th>النوع والموعد</th><th>الحالة</th><th></th></tr></thead><tbody>{% for a in rows %}<tr><td><strong>{{ a.title }}</strong><br><small dir="ltr">{{ a.number|default:'مسودة' }}</small></td><td>{{ a.club.name }}</td><td>{{ a.get_kind_display }}<br><small>{{ a.date|default:'لم يحدد' }}</small></td><td><span class="badge">{{ a.get_status_display }}</span></td><td><a href="{% url 'activity' a.pk %}">عرض الطلب ←</a></td></tr>{% empty %}<tr><td colspan="5" class="empty">لا توجد طلبات هنا بعد.</td></tr>{% endfor %}</tbody></table></div>
