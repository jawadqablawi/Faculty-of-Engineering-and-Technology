{% extends 'coordination/base.html' %}{% block content %}<h1>الإشعارات</h1><form method="post">{% csrf_token %}<button class="secondary">تحديد الكل كمقروء</button></form><div class="card">{% for n in notifications %}<p>{% if not n.read %}● {% endif %}{% if n.activity_id %}<a href="{% url 'activity' n.activity_id %}">{{ n.text }}</a>{% else %}{{ n.text }}{% endif %}<br><small>{{ n.created }}</small></p>{% empty %}<p class="empty">لا توجد إشعارات</p>{% endfor %}</div>{% endblock %}
