<!doctype html><html dir="rtl" lang="ar"><meta charset="utf-8"><style>@page{size:A4 landscape;margin:15mm}body{font-family:"DejaVu Sans",sans-serif}table{width:100%;border-collapse:collapse}td,th{padding:8px;border:1px solid #ccc;text-align:right}</style><h1>تقرير أنشطة كلية الهندسة والتكنولوجيا</h1><table><tr><th>الطلب</th><th>النادي</th><th>العنوان</th><th>التاريخ</th><th>الحالة</th></tr>{% for a in rows %}<tr><td>{{ a.number|default:'مسودة' }}</td><td>{{ a.club.name }}</td><td>{{ a.title }}</td><td>{{ a.date }}</td><td>{{ a.get_status_display }}</td></tr>{% endfor %}</table></html>
