{% extends 'coordination/base.html' %}{% block content %}<h1>المهام المسندة إليّ</h1>{% for task in tasks %}<div class="card"><h2>{{ task.title }}</h2><p>{{ task.due }} · {{ task.priority }} · {{ task.display_status }}</p><p>{{ task.notes|linebreaksbr }}</p><form method="post" action="{% url 'task_status' task.pk %}">{% csrf_token %}<select name="status"><option value="جديدة" {% if task.status == 'جديدة' %}selected{% endif %}>جديدة</option><option value="قيد التنفيذ" {% if task.status == 'قيد التنفيذ' %}selected{% endif %}>قيد التنفيذ</option><option value="مكتملة" {% if task.status == 'مكتملة' %}selected{% endif %}>مكتملة</option></select><button>تحديث الحالة</button></form></div>{% empty %}<div class="card empty">لا توجد مهام مسندة إليك</div>{% endfor %}{% endblock %}
